name: Verify official NgelX Build574 Android download
on:
  push:
    branches: [main]
    paths: ['.github/workflows/verify-build574-download.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Verify NgelX Pages CDN serves APK with original hash and full size
        shell: bash
        run: |
          set -euo pipefail
          for try in $(seq 1 12); do
            if curl --fail --location --retry 2 --max-time 120 \
              -H 'Cache-Control: no-cache' \
              'https://ngelxsocial.com/downloads/NgelX-1.0.344-Build574.apk' \
              -o /tmp/NgelX-1.0.344-Build574.apk; then
              test "$(stat -c%s /tmp/NgelX-1.0.344-Build574.apk)" -eq 48670786
              printf '%s  %s\n' '45c8065d7c063a5aa0f9b3cb4bf4a0e9a1ab9e02c48d8ea39c45fcd8102d4391' '/tmp/NgelX-1.0.344-Build574.apk' | sha256sum -c -
              echo 'PASS: Official download APK is byte-identical to signed Build574'
              exit 0
            fi
            sleep 8
          done
          echo 'NgelX official APK URL did not pass download validation' >&2
          exit 1
